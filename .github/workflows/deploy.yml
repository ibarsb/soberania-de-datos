name: Deploy a GitHub Pages

# Despliegue en cada push a main (y manual desde la pestaña Actions)
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos requeridos por actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20 + caché de npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la presentación Slidev
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          npm run build -- --base "/${REPO_NAME}/"

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
